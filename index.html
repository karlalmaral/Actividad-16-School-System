
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School System</title>
</head>

<body>

<header>
    <img src="img/logo.png" alt="School logo" width="60">
    <h1>School System</h1>
</header>

<nav>
    <ul>
        <li><a href="#inicio">Home</a></li>
        <li><a href="#registro">Register student</a></li>
        <li><a href="#lista">Student list</a></li>
        <li><a href="#resumen">Summary</a></li>
    </ul>
</nav>


<div class="layout">

    <aside class="sidebar">
        <h2>Panel</h2>
        <ul>
            <li><a href="#estudiantes">Students</a></li>
            <li><a href="#maestros">Teachers</a></li>
            <li><a href="#administradores">Administrators</a></li>
        </ul>
    </aside>

    <main class="content">


<section id="registro">
    <h2>Register Student</h2>

    <form id="form-alumno" action="#" method="post">
        <label for="nombre">Name:</label>
        <input type="text" id="nombre" name="nombre" required>

        <br><br>

        <label for="matricula">Student ID:</label>
        <input type="text" id="matricula" name="matricula" required>

        <br><br>

        <label for="edad">Age:</label>
        <input type="number" id="edad" name="edad" min="0" max="120" required>

        <br><br>

        <label for="correo">Email:</label>
        <input type="email" id="correo" name="correo" required>

        <br><br>

        <button type="submit">Register</button>
        <button type="reset" id="btn-limpiar">Clear</button>
    </form>
</section>

<section id="lista">
    <h2>Student List</h2>

    <table id="tabla-alumnos">
        <thead>
            <tr>
                <th>Student ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            <!-- Students will appear here later -->
        </tbody>
    </table>
</section>


<section id="resumen" class="tarjetas">

    <div class="card">
        <h3>Total Students</h3>
        <p id="total-alumnos">0</p>
    </div>

    <div class="card">
        <h3>General Average</h3>
        <p id="promedio-general">-</p>
    </div>

    <div class="card">
        <h3>Last Registered</h3>
        <p id="ultimo-alumno">-</p>
    </div>

</section>


    </main>
    

</div>
<footer>
    <p>&copy; 2026 School System - Activity 16</p>
</footer>


</body>
</html>
